name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Validate the plugin
        run: npx --yes @anthropic-ai/claude-code@2 plugin validate .

      - name: Check the hooks
        run: |
          python3 -m py_compile hooks/git-guard.py
          sh -n hooks/lead-reminder.sh
          echo '{"tool_input":{"command":"git push --force origin main"},"cwd":"."}' | python3 hooks/git-guard.py | grep -q '"deny"'
          test -z "$(echo '{"tool_input":{"command":"git status"},"cwd":"."}' | python3 hooks/git-guard.py)"
          echo '{}' | sh hooks/lead-reminder.sh | python3 -m json.tool > /dev/null

      - name: Test the playbook scripts
        working-directory: skills/lead/scripts
        run: |
          bun install --frozen-lockfile
          bun test orch watch-pr
